<!doctype html><html lang="pl"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@400;500&display=swap&subset=latin,latin-ext">
<style>
:root{--paper:#FCFBF9;--ink:#14120F;--wine:#6B1F2E;--hair-lt:rgba(252,251,249,.22);}
*{box-sizing:border-box;margin:0;}
html,body{width:1200px;height:630px;overflow:hidden;}
body{position:relative;background:var(--ink);}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%;}
.scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(20,18,15,.82) 0%,rgba(20,18,15,.55) 42%,rgba(20,18,15,.06) 78%);}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;color:var(--paper);}
.mono{font-family:"Inter",sans-serif;font-size:15px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;opacity:.72;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-size:96px;line-height:1.02;letter-spacing:-.02em;max-width:15ch;}
h1 em{font-style:italic;color:#E4C9A8;}
.rule{width:88px;height:1px;background:var(--hair-lt);margin:28px 0 22px;}
.sub{font-family:"Inter",sans-serif;font-size:20px;line-height:1.5;opacity:.8;max-width:34ch;}
.foot{display:flex;justify-content:space-between;align-items:flex-end;}
</style></head><body>
<img src="../assets/hero-45m2-kitchen-bar.webp" alt="">
<div class="scrim"></div>
<div class="wrap">
  <div class="mono">Projektowanie wnętrz · Warszawa</div>
  <div>
    <h1>Natalia<br><em>Morozova</em></h1>
    <div class="rule"></div>
    <div class="sub">Mieszkania i wnętrza prywatne. Projekt, wizualizacje, dobór materiałów.</div>
  </div>
  <div class="foot"><div class="mono">nataliamorozova.design</div><div class="mono">PL · RU · EN</div></div>
</div></body></html>
